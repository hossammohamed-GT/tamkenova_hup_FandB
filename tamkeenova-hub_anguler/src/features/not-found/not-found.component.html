<div class="notfound">
  <div class="notfound-card">
    <span class="notfound-code numeric" aria-hidden="true">404</span>
    <h1 class="notfound-title">{{ 'notfound.title' | translate }}</h1>
    <p class="notfound-subtitle">{{ 'notfound.subtitle' | translate }}</p>
    <div class="notfound-actions">
      <a routerLink="/" class="btn-primary">
        <i class="fa-solid fa-house"></i>
        {{ 'notfound.cta_home' | translate }}
      </a>
      <a routerLink="/programs" class="btn-secondary">
        {{ 'notfound.cta_programs' | translate }}
      </a>
    </div>
  </div>
</div>
