<div class="auth-page">
  <section class="auth-visual-col">
    <app-auth-visual-panel mode="login" />
  </section>

  <section class="auth-form-col">
    <div class="auth-card">
      <span class="auth-eyebrow">{{ 'auth.forgot.eyebrow' | translate }}</span>
      <h1 class="auth-title">{{ 'auth.forgot.title' | translate }}</h1>
      <p class="auth-subtitle text-muted">{{ 'auth.forgot.subtitle' | translate }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
        <div class="field" [class.is-valid]="isFieldValid('email')" [class.is-invalid]="isFieldInvalid('email')">
          <label class="field-label" for="email">{{ 'auth.fields.email' | translate }}</label>
          <div class="field-input-wrap">
            <input id="email" type="email" class="field-input" formControlName="email"
              (input)="markTouched('email')" autocomplete="email" dir="ltr" />
          </div>
          <span class="field-hint" [class.is-error]="isFieldInvalid('email')">
            @if (isFieldInvalid('email')) {
              {{ 'auth.errors.email' | translate }}
            }
          </span>
        </div>

        @if (errorMessage()) {
          <div class="form-error-banner">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ errorMessage() | translate }}</span>
          </div>
        }

        <button type="submit" class="btn-primary auth-submit" [disabled]="isLoading()">
          @if (isLoading()) {
            <i class="fa-solid fa-spinner"></i>
          } @else {
            {{ 'auth.forgot.submit' | translate }}
          }
        </button>
      </form>

      <p class="auth-switch text-muted">
        <a routerLink="/login">{{ 'auth.forgot.back' | translate }}</a>
      </p>
    </div>
  </section>
</div>
