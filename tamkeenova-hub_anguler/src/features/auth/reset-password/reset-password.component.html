<div class="auth-page">
  <section class="auth-visual-col">
    <app-auth-visual-panel mode="login" />
  </section>

  <section class="auth-form-col">
    <div class="auth-card">
      <span class="auth-eyebrow">{{ 'auth.reset.eyebrow' | translate }}</span>
      <h1 class="auth-title">{{ 'auth.reset.title' | translate }}</h1>
      <p class="auth-subtitle text-muted">
        {{ 'auth.reset.subtitle' | translate }}
        <strong>{{ email }}</strong>
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" novalidate>
        <div class="field">
          <label class="field-label" for="otp">{{ 'auth.fields.otp' | translate }}</label>
          <div class="field-input-wrap">
            <input id="otp" type="text" class="field-input" formControlName="otp" maxlength="6" dir="ltr" autocomplete="one-time-code" />
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="new_password">{{ 'auth.fields.password' | translate }}</label>
          <div class="field-input-wrap">
            <input [type]="showPassword() ? 'text' : 'password'" id="new_password" class="field-input"
              formControlName="new_password" autocomplete="new-password" />
            <button type="button" class="field-toggle-visibility" (click)="togglePasswordVisibility()">
              <i class="fa-solid" [class.fa-eye]="!showPassword()" [class.fa-eye-slash]="showPassword()"></i>
            </button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="confirm_password">{{ 'auth.fields.confirm_password' | translate }}</label>
          <div class="field-input-wrap">
            <input [type]="showPassword() ? 'text' : 'password'" id="confirm_password" class="field-input"
              formControlName="confirm_password" autocomplete="new-password" />
          </div>
        </div>

        @if (errorMessage()) {
          <div class="form-error-banner">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>{{ errorMessage() | translate }}</span>
          </div>
        }

        <button type="submit" class="btn-primary auth-submit" [disabled]="isLoading()">
          @if (isLoading()) {
            <i class="fa-solid fa-spinner"></i>
          } @else {
            {{ 'auth.reset.submit' | translate }}
          }
        </button>
      </form>

      <p class="auth-switch text-muted">
        <a routerLink="/forgot-password">{{ 'auth.reset.resend' | translate }}</a>
      </p>
    </div>
  </section>
</div>
